<title>99老师带你翻译简单句</title>
<style>
:root{--blue:#0071e3;--green:#34c759;--red:#ff3b30;--yellow:#b7791f;--fs:1}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -14%,rgba(41,151,255,.12),transparent 28%),linear-gradient(180deg,#fff 0%,#f7f9fc 58%,#f5f5f7 100%);color:#1d1d1f;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:72px 1fr 84px;padding:0 34px 18px}.topbar,.bottom{display:flex;align-items:center;border:1px solid rgba(0,0,0,.055);background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);box-shadow:0 10px 30px rgba(0,0,0,.04)}.topbar{margin-top:10px;padding:0 18px;border-radius:18px;justify-content:space-between}.brand-main{font-size:16px;font-weight:730}.brand-main:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:linear-gradient(180deg,#2997ff,#0071e3);box-shadow:0 0 0 4px rgba(0,113,227,.08);vertical-align:1px}.brand-sub{margin-top:4px;color:#a1a1a6;font-size:9px;letter-spacing:1.8px}.top-actions{display:flex;gap:10px}.progress-btn,.icon-btn,.tool{border:1px solid rgba(0,0,0,.065);background:#fff;color:#6e6e73;cursor:pointer;transition:.18s}.progress-btn{height:40px;padding:0 15px;border-radius:13px;color:#005bb5;background:rgba(0,113,227,.055);border-color:rgba(0,113,227,.12);font-weight:600}.icon-btn{width:40px;height:40px;border-radius:12px}.stage{min-height:0;position:relative;padding:18px 0}.page{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.page.active{display:flex}.question-shell,.explain-shell{width:min(1160px,96%);text-align:center;border:1px solid rgba(0,0,0,.045);background:rgba(255,255,255,.91);border-radius:32px;box-shadow:0 28px 80px rgba(20,62,100,.06);padding:70px 56px 58px}.cn{font-size:calc(clamp(32px,3.35vw,52px)*var(--fs));font-weight:700;line-height:1.28;margin-bottom:70px;letter-spacing:-1.1px}.slots{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:24px 13px;padding:0 20px}.slot{position:relative;min-width:34px;height:60px;padding:0 5px 10px;display:flex;align-items:flex-end;justify-content:center;border:none;outline:none;white-space:nowrap;font-size:calc(clamp(25px,2.5vw,39px)*var(--fs));font-weight:650;color:#1d1d1f;letter-spacing:-.45px}.slot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:20px;background:#d2d2d7}.slot:focus:after,.slot.active:after{background:linear-gradient(90deg,#0071e3,#2997ff);box-shadow:0 5px 14px rgba(0,113,227,.16)}.slot.ok:after{background:var(--green)}.slot.bad:after{background:var(--red);animation:shake .22s linear 2}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.hintline{min-height:38px;margin-top:30px;color:#6e6e73;font-size:calc(15px*var(--fs));opacity:0;transition:.2s}.hintline.show{opacity:1}.bottom{justify-content:center;gap:10px;border-radius:20px}.tool{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;position:relative}.tool:hover,.icon-btn:hover{color:#0071e3;border-color:rgba(0,113,227,.18)}.tool.primary{background:linear-gradient(180deg,#0a84ff,#0071e3);border-color:#0071e3;color:#fff;box-shadow:0 8px 20px rgba(0,113,227,.20)}.tool.disabled{opacity:.28;pointer-events:none}.sep{width:1px;height:24px;background:rgba(0,0,0,.08);margin:0 4px}.tool svg,.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.celebrate{background:radial-gradient(circle at 50% 42%,rgba(41,151,255,.16),transparent 28%),linear-gradient(180deg,#fff,#f5f8fb)}.correct-wrap{text-align:center;z-index:2}.checkmark{width:72px;height:72px;border:1px solid rgba(0,113,227,.15);border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:#fff;box-shadow:0 18px 42px rgba(0,0,0,.06)}.checkmark svg{width:34px;height:34px;stroke:#0071e3;fill:none;stroke-width:2.1}.correct{font-size:clamp(66px,9vw,132px);font-weight:920;letter-spacing:-4px}.correct-no{margin-top:12px;color:#86868b;font-size:14px;letter-spacing:1.5px}.particle,.ribbon{position:absolute;opacity:0}.particle{left:50%;top:50%;width:7px;height:18px;border-radius:3px;animation:fly 1.05s ease-out forwards}@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}.ribbon{top:-12vh;width:9px;height:28px;border-radius:3px;animation:ribbonFall 1.45s cubic-bezier(.18,.75,.3,1) forwards}@keyframes ribbonFall{0%{opacity:0;transform:translate3d(0,-10vh,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(var(--x),112vh,0) rotate(var(--r))}}.explain-shell{width:min(1080px,94%);padding:48px 42px}.explain-kicker{font-size:10px;color:#a1a1a6;letter-spacing:2px;margin-bottom:16px}.full{font-size:calc(clamp(34px,4.1vw,62px)*var(--fs));font-weight:720;line-height:1.35;margin-bottom:34px;letter-spacing:-1.4px}.parts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.part{padding:13px 16px;border:1px solid rgba(0,0,0,.055);background:#f7f9fb;border-radius:18px;min-width:150px}.part .lab{font-size:11px;margin-bottom:7px;font-weight:700}.part .txt{font-size:calc(17px*var(--fs));font-weight:680}.part[data-kind="subject"] .lab,.part[data-kind="subject"] .txt{color:#0071e3}.part[data-kind="verb"] .lab,.part[data-kind="verb"] .txt{color:#30a7bd}.part[data-kind="object"] .lab,.part[data-kind="object"] .txt{color:#d97706}.part[data-kind="complement"] .lab,.part[data-kind="complement"] .txt{color:#9b51c9}.part[data-kind="adverbial"] .lab,.part[data-kind="adverbial"] .txt{color:#248a3d}.part[data-kind="structure"] .lab,.part[data-kind="structure"] .txt{color:#5856d6}.part[data-kind="other"] .lab,.part[data-kind="other"] .txt{color:#6e6e73}.explain-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(820px,100%);margin:auto;text-align:left}.info{border:1px solid rgba(0,0,0,.055);background:#f7f9fb;border-radius:18px;padding:17px 18px}.info .k{color:#86868b;font-size:11px;margin-bottom:8px}.info .v{font-size:calc(16px*var(--fs));line-height:1.6}.overlay{position:fixed;inset:0;background:rgba(232,232,237,.54);backdrop-filter:blur(18px) saturate(140%);display:none;align-items:center;justify-content:center;z-index:20}.overlay.show{display:flex}.panel{width:min(620px,88vw);max-height:76vh;overflow:auto;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.92);border-radius:24px;padding:22px;box-shadow:0 26px 80px rgba(0,0,0,.12)}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel-title{font-size:15px;font-weight:730}.close{width:34px;height:34px;border-radius:10px;border:1px solid rgba(0,0,0,.06);background:#f5f5f7;color:#6e6e73;cursor:pointer}.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.qnum{height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.055);background:#f7f7f8;color:#6e6e73;cursor:pointer}.qnum.current{color:#fff;border-color:#0071e3;background:linear-gradient(180deg,#0a84ff,#0071e3)}.qnum.done{color:#1d1d1f;background:#fff}.qnum.fav{box-shadow:inset 0 -2px 0 rgba(183,121,31,.7)}.slider-row{display:flex;align-items:center;gap:14px;margin-top:10px}input[type=range]{width:100%}.small{color:#86868b;font-size:12px;line-height:1.6}#soundBtn.muted{color:#b8b8bd;background:#f2f2f3}@media(max-width:780px){.app{padding:0 14px 12px;grid-template-rows:66px 1fr 78px}.brand-sub{display:none}.question-shell{padding:58px 22px 48px;border-radius:26px}.cn{margin-bottom:54px}.tool{width:46px;height:46px}.grid30{grid-template-columns:repeat(5,1fr)}.explain-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="app"><header class="topbar"><div><div class="brand-main">99老师带你翻译简单句</div><div class="brand-sub">SIMPLE SENTENCE TRANSLATION</div></div><div class="top-actions"><button class="progress-btn" id="progressBtn">01 / 50</button><button class="icon-btn" id="fontBtn" aria-label="字体大小"><span style="font-size:15px;font-weight:700">Aa</span></button><button class="icon-btn" id="soundBtn" aria-label="音效"><svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path d="M17 9c1 .8 1.5 1.8 1.5 3S18 14.2 17 15"/></svg></button><button class="icon-btn" id="fullBtn" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button></div></header><main class="stage"><section class="page active" id="questionPage"><div class="question-shell"><div class="cn" id="cn"></div><div class="slots" id="slots"></div><div class="hintline" id="hintline"></div></div></section><section class="page celebrate" id="celebratePage"><div class="correct-wrap"><div class="checkmark"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></div><div class="correct">CORRECT</div><div class="correct-no" id="correctNo"></div></div></section><section class="page" id="explainPage"><div class="explain-shell"><div class="explain-kicker">SENTENCE ANALYSIS</div><div class="full" id="fullSentence"></div><div class="parts" id="parts"></div><div class="explain-grid"><div class="info"><div class="k">句子结构</div><div class="v" id="structure"></div></div><div class="info"><div class="k">写作提醒</div><div class="v" id="tip"></div></div></div></div></section></main><footer class="bottom"><button class="tool" id="prevBtn"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="tool" id="speakBtn"><svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path d="M17 9c1 .8 1.5 1.8 1.5 3S18 14.2 17 15"/><path d="M19 6.5c1.7 1.5 2.5 3.3 2.5 5.5S20.7 16 19 17.5"/></svg></button><div class="sep"></div><button class="tool" id="hintBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="5"/><path d="M10 16h4M10.5 19h3"/></svg></button><button class="tool primary" id="checkBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></button><button class="tool" id="revealBtn"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5z"/><circle cx="12" cy="12" r="2.5"/></svg></button><button class="tool" id="favBtn"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3z"/></svg></button><div class="sep"></div><button class="tool" id="nextBtn"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></footer></div><div class="overlay" id="navOverlay"><div class="panel"><div class="panel-head"><div class="panel-title">题目导航</div><button class="close" data-close="navOverlay">×</button></div><div class="grid30" id="grid30"></div></div></div><div class="overlay" id="fontOverlay"><div class="panel" style="width:min(460px,88vw)"><div class="panel-head"><div class="panel-title">字体大小</div><button class="close" data-close="fontOverlay">×</button></div><div class="slider-row"><span class="small">小</span><input type="range" id="fontRange" min="85" max="125" value="100"><span class="small">大</span></div><div class="small" style="margin-top:14px">题目、横线答案和解析页会同步缩放。</div></div></div>
<script>
const questions=[{"cn":"我妹妹每天晚上读半小时英语。","answer":"My sister reads English for half an hour every evening.","hint":null,"parts":[["My sister","主语 S"],["reads","谓语 V"],["English","宾语 O"],["for half an hour","时长"],["every evening","时间"]],"structure":"S + V + O + 时长 + 时间","tip":"every evening 表示习惯性动作，主语是第三人称单数，read 要变为 reads。"},{"cn":"桌子上有一本蓝色的词典。","answer":"There is a blue dictionary on the table.","hint":"dictionary：词典","parts":[["There is","There be 结构"],["a blue dictionary","存在的人/物"],["on the table","地点"]],"structure":"There be + 名词 + 地点","tip":"There be 用来表示“某处有某物”。be 动词通常和后面的名词在数上保持一致。"},{"cn":"我的朋友上周参观了那座博物馆。","answer":"My friend visited the museum last week.","hint":"museum：博物馆","parts":[["My friend","主语 S"],["visited","谓语 V"],["the museum","宾语 O"],["last week","时间"]],"structure":"S + V + O + 时间","tip":"last week 是明确的过去时间，谓语使用一般过去时。"},{"cn":"孩子们正在操场上踢足球。","answer":"The children are playing football on the playground.","hint":"playground：操场","parts":[["The children","主语 S"],["are playing","谓语 V"],["football","宾语 O"],["on the playground","地点"]],"structure":"S + be + doing + O + 地点","tip":"描述此刻正在发生的动作，用现在进行时。"},{"cn":"这部电影让我感到非常放松。","answer":"The movie makes me feel very relaxed.","hint":"relaxed：放松的","parts":[["The movie","主语 S"],["makes","谓语 V"],["me","宾语 O"],["feel very relaxed","宾语补足语 C"]],"structure":"S + V + O + C","tip":"make sb. do sth. 中，make 后面的动词使用原形。"},{"cn":"我们应该保护我们的环境。","answer":"We should protect our environment.","hint":"protect：保护；environment：环境","parts":[["We","主语 S"],["should protect","谓语 V"],["our environment","宾语 O"]],"structure":"S + 情态动词 + V + O","tip":"should 后接动词原形。"},{"cn":"她通常在早餐后检查电子邮件。","answer":"She usually checks her email after breakfast.","hint":null,"parts":[["She","主语 S"],["usually checks","谓语 V"],["her email","宾语 O"],["after breakfast","时间"]],"structure":"S + 频度副词 + V + O + 时间","tip":"usually 通常放在实义动词前；she 作主语时 check 变为 checks。"},{"cn":"我父亲给我买了一台新电脑。","answer":"My father bought me a new computer.","hint":null,"parts":[["My father","主语 S"],["bought","谓语 V"],["me","间接宾语 IO"],["a new computer","直接宾语 DO"]],"structure":"S + V + IO + DO","tip":"buy sb. sth. 表示“给某人买某物”。"},{"cn":"越来越多的学生使用人工智能学习英语。","answer":"More and more students use AI to learn English.","hint":null,"parts":[["More and more students","主语 S"],["use","谓语 V"],["AI","宾语 O"],["to learn English","目的状语"]],"structure":"S + V + O + to do","tip":"to learn English 在这里表示目的。"},{"cn":"充足的睡眠能提高我们的学习效率。","answer":"Enough sleep can improve our learning efficiency.","hint":"efficiency：效率","parts":[["Enough sleep","主语 S"],["can improve","谓语 V"],["our learning efficiency","宾语 O"]],"structure":"S + 情态动词 + V + O","tip":"can 后使用动词原形 improve。"},{"cn":"昨天的会议持续了两个小时。","answer":"The meeting lasted for two hours yesterday.","hint":"last：持续","parts":[["The meeting","主语 S"],["lasted","谓语 V"],["for two hours","时长"],["yesterday","时间"]],"structure":"S + V + 时长 + 时间","tip":"last 作动词表示“持续”；昨天发生，用 lasted。"},{"cn":"他的笑话使全班同学都笑了。","answer":"His joke made the whole class laugh.","hint":"the whole class：全班同学","parts":[["His joke","主语 S"],["made","谓语 V"],["the whole class","宾语 O"],["laugh","宾语补足语 C"]],"structure":"S + V + O + C","tip":"make sb. do sth.：使某人做某事。"},{"cn":"我们学校将在下个月举办一场英语比赛。","answer":"Our school will hold an English competition next month.","hint":"competition：比赛","parts":[["Our school","主语 S"],["will hold","谓语 V"],["an English competition","宾语 O"],["next month","时间"]],"structure":"S + will + V + O + 时间","tip":"next month 表示将来时间，可用 will + 动词原形。"},{"cn":"这张照片让我想起了我的童年。","answer":"This photo reminds me of my childhood.","hint":"remind：使想起；childhood：童年","parts":[["This photo","主语 S"],["reminds","谓语 V"],["me","宾语 O"],["of my childhood","介词短语"]],"structure":"S + remind + sb. + of sth.","tip":"remind sb. of sth. 表示“使某人想起某事”。"},{"cn":"老师要求我们按时完成作业。","answer":"The teacher asked us to finish the homework on time.","hint":null,"parts":[["The teacher","主语 S"],["asked","谓语 V"],["us","宾语 O"],["to finish the homework","宾语补足语 C"],["on time","时间"]],"structure":"S + ask + sb. + to do + 时间","tip":"ask sb. to do sth. 表示“要求某人做某事”。"},{"cn":"每天锻炼使他保持健康。","answer":"Daily exercise keeps him healthy.","hint":null,"parts":[["Daily exercise","主语 S"],["keeps","谓语 V"],["him","宾语 O"],["healthy","宾语补足语 C"]],"structure":"S + V + O + C","tip":"keep sb. + 形容词表示“使某人保持某种状态”。"},{"cn":"这座桥连接城市的两个部分。","answer":"The bridge connects the two parts of the city.","hint":"connect：连接；bridge：桥","parts":[["The bridge","主语 S"],["connects","谓语 V"],["the two parts of the city","宾语 O"]],"structure":"S + V + O","tip":"bridge 是第三人称单数，谓语用 connects。"},{"cn":"我忘记把雨伞带到办公室了。","answer":"I forgot to bring my umbrella to the office.","hint":"umbrella：雨伞","parts":[["I","主语 S"],["forgot","谓语 V"],["to bring my umbrella","宾语"],["to the office","地点"]],"structure":"S + forget + to do + 地点","tip":"forget to do 表示“忘记去做某事”。"},{"cn":"他的父母鼓励他独自解决这个问题。","answer":"His parents encouraged him to solve the problem by himself.","hint":"encourage：鼓励；by himself：独自","parts":[["His parents","主语 S"],["encouraged","谓语 V"],["him","宾语 O"],["to solve the problem","宾语补足语 C"],["by himself","方式"]],"structure":"S + encourage + sb. + to do + 方式","tip":"encourage sb. to do sth. 表示“鼓励某人做某事”。"},{"cn":"互联网改变了我们的交流方式。","answer":"The Internet has changed the way we communicate.","hint":"communicate：交流","parts":[["The Internet","主语 S"],["has changed","谓语 V"],["the way we communicate","宾语 O"]],"structure":"S + have/has done + O","tip":"强调过去的变化对现在仍有影响，可用现在完成时。"},{"cn":"我花了一个小时准备今天的课程。","answer":"I spent an hour preparing today's lesson.","hint":null,"parts":[["I","主语 S"],["spent","谓语 V"],["an hour","时间"],["preparing today's lesson","doing 结构"]],"structure":"S + spend + 时间 + doing","tip":"spend time doing sth. 表示“花时间做某事”。"},{"cn":"这个好消息给了我们继续努力的信心。","answer":"The good news gave us confidence to keep trying.","hint":"confidence：信心","parts":[["The good news","主语 S"],["gave","谓语 V"],["us","间接宾语 IO"],["confidence","直接宾语 DO"],["to keep trying","后置修饰"]],"structure":"S + V + IO + DO + to do","tip":"give sb. sth.；to keep trying 补充说明 confidence。"},{"cn":"不断上涨的价格影响了人们的选择。","answer":"Rising prices have influenced people's choices.","hint":"influence：影响；rising：上涨的","parts":[["Rising prices","主语 S"],["have influenced","谓语 V"],["people's choices","宾语 O"]],"structure":"S + have done + O","tip":"prices 是复数，完成时用 have influenced。"},{"cn":"她把所有重要的信息都写在了笔记本里。","answer":"She wrote all the important information in her notebook.","hint":"information：信息（不可数）","parts":[["She","主语 S"],["wrote","谓语 V"],["all the important information","宾语 O"],["in her notebook","地点"]],"structure":"S + V + O + 地点","tip":"information 是不可数名词；write 的过去式是 wrote。"},{"cn":"这个小习惯最终带来了很大的变化。","answer":"This small habit finally made a big difference.","hint":"make a difference：带来改变；产生影响","parts":[["This small habit","主语 S"],["finally made","谓语 V"],["a big difference","宾语 O"]],"structure":"S + V + O","tip":"make a difference 是常用搭配，表示“产生影响、带来变化”。"},{"cn":"学校为新生提供了许多学习资源。","answer":"The school provided new students with many learning resources.","hint":"provide：提供；resource：资源","parts":[["The school","主语 S"],["provided","谓语 V"],["new students","宾语 O"],["with many learning resources","介词短语"]],"structure":"S + provide + sb. + with sth.","tip":"provide sb. with sth. 表示“为某人提供某物”。"},{"cn":"我发现在嘈杂的房间里很难集中注意力。","answer":"I find it difficult to concentrate in a noisy room.","hint":"concentrate：集中注意力；noisy：嘈杂的","parts":[["I","主语 S"],["find","谓语 V"],["it","形式宾语"],["difficult","宾语补足语 C"],["to concentrate in a noisy room","真正宾语"]],"structure":"S + find + it + adj. + to do","tip":"it 作形式宾语，真正的内容是后面的 to concentrate。"},{"cn":"他的努力最终得到了回报。","answer":"His hard work finally paid off.","hint":"pay off：得到回报","parts":[["His hard work","主语 S"],["finally paid off","谓语 V"]],"structure":"S + V","tip":"pay off 表示“取得成功、得到回报”，这里不需要宾语。"},{"cn":"我们必须充分利用有限的时间。","answer":"We must make full use of the limited time.","hint":"make full use of：充分利用；limited：有限的","parts":[["We","主语 S"],["must make","谓语 V"],["full use of the limited time","宾语 O"]],"structure":"S + 情态动词 + V + O","tip":"must 后接动词原形；make full use of 表示“充分利用”。"},{"cn":"一次小小的成功可能会增强学生的自信心。","answer":"A small success may build a student's confidence.","hint":"confidence：自信心","parts":[["A small success","主语 S"],["may build","谓语 V"],["a student's confidence","宾语 O"]],"structure":"S + 情态动词 + V + O","tip":"may 后接动词原形；build confidence 表示“建立、增强信心”。"},{"cn":"我每天早上步行去地铁站。","answer":"I walk to the subway station every morning.","hint":"subway station：地铁站","parts":[["I","主语 S"],["walk","谓语 V"],["to the subway station","地点"],["every morning","时间"]],"structure":"S + V + 地点 + 时间","tip":"every morning 表示经常发生的动作，使用一般现在时。"},{"cn":"这杯咖啡闻起来很香。","answer":"This coffee smells very good.","hint":"smell：闻起来","parts":[["This coffee","主语 S"],["smells","系动词"],["very good","表语 P"]],"structure":"S + 系动词 + P","tip":"smell 可作系动词，后面接形容词说明主语的状态。"},{"cn":"我的哥哥正在厨房做晚饭。","answer":"My brother is cooking dinner in the kitchen.","hint":null,"parts":[["My brother","主语 S"],["is cooking","谓语 V"],["dinner","宾语 O"],["in the kitchen","地点"]],"structure":"S + be + doing + O + 地点","tip":"描述此刻正在发生的动作，用现在进行时。"},{"cn":"昨晚我给朋友发了一条消息。","answer":"I sent my friend a message last night.","hint":"send：发送；message：消息","parts":[["I","主语 S"],["sent","谓语 V"],["my friend","间接宾语 IO"],["a message","直接宾语 DO"],["last night","时间"]],"structure":"S + V + IO + DO + 时间","tip":"send sb. sth. 表示“给某人发送某物”；send 的过去式是 sent。"},{"cn":"音乐使这个房间更加温馨。","answer":"Music makes the room more comfortable.","hint":"comfortable：舒适的","parts":[["Music","主语 S"],["makes","谓语 V"],["the room","宾语 O"],["more comfortable","宾语补足语 C"]],"structure":"S + V + O + C","tip":"make + 宾语 + 形容词，表示“使……变得……”。"},{"cn":"我们需要在周五之前完成这个项目。","answer":"We need to finish the project before Friday.","hint":"project：项目","parts":[["We","主语 S"],["need","谓语 V"],["to finish the project","宾语"],["before Friday","时间"]],"structure":"S + need + to do + 时间","tip":"need to do sth. 表示“需要做某事”。"},{"cn":"教室里有三扇大窗户。","answer":"There are three large windows in the classroom.","hint":"window：窗户","parts":[["There are","There be 结构"],["three large windows","存在的人/物"],["in the classroom","地点"]],"structure":"There be + 名词 + 地点","tip":"windows 是复数，因此使用 There are。"},{"cn":"这道题比我想象的更容易。","answer":"This question is easier than I expected.","hint":"expect：预期；easier：更容易的","parts":[["This question","主语 S"],["is","系动词"],["easier","表语 P"],["than I expected","比较结构"]],"structure":"S + be + 比较级 + than...","tip":"easy 的比较级是 easier；than 后接比较对象。"},{"cn":"她已经看完了这本书。","answer":"She has already finished reading the book.","hint":null,"parts":[["She","主语 S"],["has already finished","谓语 V"],["reading the book","宾语"]],"structure":"S + have/has done + doing","tip":"finish doing sth. 表示“完成做某事”；already 常用于完成时。"},{"cn":"雨停后我们出去散了步。","answer":"We went for a walk after the rain stopped.","hint":"go for a walk：去散步","parts":[["We","主语 S"],["went for a walk","谓语部分"],["after the rain stopped","时间状语从句"]],"structure":"主句 + after + 时间状语从句","tip":"after 可以连接完整句子，表示“在……之后”。"},{"cn":"保持房间整洁并不困难。","answer":"Keeping the room clean is not difficult.","hint":"keep...clean：保持……整洁","parts":[["Keeping the room clean","主语 S"],["is","系动词"],["not difficult","表语 P"]],"structure":"Doing + be + P","tip":"动名词短语可以作主语；keep + O + adj. 表示“使……保持某状态”。"},{"cn":"老师给我们展示了一种新的学习方法。","answer":"The teacher showed us a new way to learn.","hint":null,"parts":[["The teacher","主语 S"],["showed","谓语 V"],["us","间接宾语 IO"],["a new way to learn","直接宾语 DO"]],"structure":"S + V + IO + DO","tip":"show sb. sth. 表示“给某人展示某物”；to learn 修饰 way。"},{"cn":"我认为每天复习单词很重要。","answer":"I think it important to review words every day.","hint":"review：复习","parts":[["I","主语 S"],["think","谓语 V"],["it","形式宾语"],["important","宾语补足语 C"],["to review words every day","真正宾语"]],"structure":"S + think + it + adj. + to do","tip":"it 是形式宾语，真正的内容放在后面的 to do 结构中。"},{"cn":"如果明天天气好，我们就去爬山。","answer":"We will go hiking if the weather is fine tomorrow.","hint":"go hiking：去徒步；爬山","parts":[["We","主语 S"],["will go hiking","谓语 V"],["if the weather is fine tomorrow","条件状语从句"]],"structure":"主句 + if + 条件状语从句","tip":"真实条件句中，主句可用 will，从句通常用一般现在时表示将来。"},{"cn":"她太累了，不能继续工作。","answer":"She is too tired to continue working.","hint":"continue：继续","parts":[["She","主语 S"],["is","系动词"],["too tired","表语 P"],["to continue working","结果"]],"structure":"S + be + too + adj. + to do","tip":"too...to... 表示“太……而不能……”。"},{"cn":"这个箱子足够轻，我可以搬动它。","answer":"The box is light enough for me to carry.","hint":"carry：搬；携带","parts":[["The box","主语 S"],["is","系动词"],["light enough","表语 P"],["for me to carry","补充说明"]],"structure":"S + be + adj. + enough + for sb. to do","tip":"enough 修饰形容词时放在形容词后面：light enough。"},{"cn":"我妈妈不允许我熬夜。","answer":"My mother does not allow me to stay up late.","hint":"allow：允许；stay up late：熬夜","parts":[["My mother","主语 S"],["does not allow","谓语 V"],["me","宾语 O"],["to stay up late","宾语补足语 C"]],"structure":"S + allow + sb. + to do","tip":"allow sb. to do sth. 表示“允许某人做某事”；does 后用动词原形。"},{"cn":"学好英语需要时间和耐心。","answer":"Learning English well takes time and patience.","hint":"patience：耐心","parts":[["Learning English well","主语 S"],["takes","谓语 V"],["time and patience","宾语 O"]],"structure":"Doing + V + O","tip":"动名词短语作主语通常视为单数，因此谓语用 takes。"},{"cn":"没有你的帮助，我无法完成这项工作。","answer":"I cannot finish the work without your help.","hint":"without：没有；在没有……的情况下","parts":[["I","主语 S"],["cannot finish","谓语 V"],["the work","宾语 O"],["without your help","条件/方式"]],"structure":"S + 情态动词 + V + O + 介词短语","tip":"without + 名词表示“没有……；在没有……的情况下”。"},{"cn":"越来越多的人开始关注健康饮食。","answer":"More and more people are beginning to care about healthy eating.","hint":"care about：关注；在意","parts":[["More and more people","主语 S"],["are beginning","谓语 V"],["to care about healthy eating","宾语"]],"structure":"S + be doing + to do","tip":"begin to do 表示“开始做某事”；care about 后接名词或动名词。"}];
let index=0,currentPage="question",soundEnabled=true,audioCtx=null;const done=new Set(),fav=new Set(),$=id=>document.getElementById(id);function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();return audioCtx}function tone(freq=440,dur=.06,type="sine",gain=.03,delay=0){if(!soundEnabled)return;const ctx=ensureAudio();if(!ctx)return;const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}function typingSound(){tone(760,.045,"triangle",.04);tone(1180,.03,"sine",.018,.008)}function correctSound(){tone(523.25,.14,"sine",.06);tone(659.25,.16,"sine",.055,.07);tone(783.99,.2,"sine",.05,.14)}function wrongSound(){tone(330,.13,"sine",.05);tone(247,.16,"sine",.044,.09)}function words(q){return q.answer.trim().replace(/[.?!]+$/,'').split(/\s+/)}function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');currentPage=id==='questionPage'?'question':id==='explainPage'?'explain':'celebrate'}function slotWidth(w){return Math.max(34,Math.min(190,w.length*17+16))}function renderQuestion(){const q=questions[index];$('cn').textContent=q.cn;$('hintline').classList.remove('show');$('hintline').textContent=q.hint||'';$('hintBtn').classList.toggle('disabled',!q.hint);$('progressBtn').textContent=String(index+1).padStart(2,'0')+' / '+questions.length;$('favBtn').style.color=fav.has(index)?'var(--yellow)':'#9aa6b7';$('slots').innerHTML=words(q).map((w,i)=>`<div class="slot" contenteditable="true" spellcheck="false" style="min-width:${slotWidth(w)}px"></div>`).join('');wireSlots();page('questionPage');setTimeout(()=>focusSlot(0),30);updateNav()}function wireSlots(){document.querySelectorAll('.slot').forEach((el,i)=>{el.addEventListener('focus',()=>{document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));el.classList.add('active')});el.addEventListener('input',typingSound);el.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();focusSlot(i+1)}else if(e.key==='Tab'){e.preventDefault();focusSlot(i+(e.shiftKey?-1:1))}else if(e.key==='Backspace'&&el.textContent===''&&i>0){e.preventDefault();focusSlot(i-1)}else if(e.key==='Enter'){e.preventDefault();checkAnswer()}})})}function focusSlot(i){const s=[...document.querySelectorAll('.slot')];if(!s.length)return;i=Math.max(0,Math.min(s.length-1,i));const el=s[i];el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r)}function norm(x){return x.toLowerCase().replace(/[.?!，。！？]/g,'').replace(/\s+/g,' ').trim()}function checkAnswer(){const slots=[...document.querySelectorAll('.slot')],ans=words(questions[index]);let all=true;slots.forEach((s,i)=>{s.classList.remove('ok','bad');if(norm(s.textContent)===norm(ans[i]||''))s.classList.add('ok');else{s.classList.add('bad');all=false}});if(all){correctSound();done.add(index);setTimeout(()=>{speak();runCelebrate()},260)}else{wrongSound();setTimeout(()=>slots.forEach(s=>s.classList.remove('bad')),650)}}function reveal(){const ans=words(questions[index]);document.querySelectorAll('.slot').forEach((s,i)=>{s.textContent=ans[i]||'';s.classList.add('ok')});setTimeout(showExplanation,380)}function runCelebrate(){page('celebratePage');$('correctNo').textContent=String(index+1).padStart(2,'0')+' / '+questions.length;const p=$('celebratePage'),cs=['#0071e3','#0a84ff','#64d2ff','#34c759','#ff9f0a','#af52de','#ff375f'];p.querySelectorAll('.particle,.ribbon').forEach(x=>x.remove());for(let i=0;i<28;i++){const x=document.createElement('i');x.className='particle';x.style.background=cs[i%cs.length];x.style.setProperty('--dx',(Math.random()*800-400)+'px');x.style.setProperty('--dy',(Math.random()*-440+90)+'px');x.style.setProperty('--rot',(Math.random()*680-340)+'deg');p.appendChild(x)}for(let i=0;i<34;i++){const r=document.createElement('i');r.className='ribbon';r.style.left=(Math.random()*96+2)+'%';r.style.background=cs[i%cs.length];r.style.setProperty('--x',(Math.random()*180-90)+'px');r.style.setProperty('--r',(Math.random()*1000-500)+'deg');p.appendChild(r)}setTimeout(showExplanation,1450)}function grammarKind(label){const x=label.toLowerCase();if(x.includes('主语')||x==='s')return'subject';if(x.includes('谓语')||x.includes('动词')||x==='v')return'verb';if(x.includes('宾语')||x.includes('io')||x.includes('do'))return'object';if(x.includes('补足')||x.includes('真正宾语')||x.includes('形式宾语'))return'complement';if(x.includes('时间')||x.includes('地点')||x.includes('方式')||x.includes('时长')||x.includes('目的'))return'adverbial';if(x.includes('结构')||x.includes('there be'))return'structure';return'other'}function showExplanation(){const q=questions[index];$('fullSentence').textContent=q.answer;$('parts').innerHTML=q.parts.map(p=>`<div class="part" data-kind="${grammarKind(p[1])}"><div class="lab">${p[1]}</div><div class="txt">${p[0]}</div></div>`).join('');$('structure').textContent=q.structure;$('tip').textContent=q.tip;page('explainPage')}function change(d){index=(index+d+questions.length)%questions.length;renderQuestion()}function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(questions[index].answer);u.lang='en-US';u.rate=.88;u.volume=.48;speechSynthesis.speak(u)}function updateNav(){const g=$('grid30');g.innerHTML=questions.map((_,i)=>`<button class="qnum ${i===index?'current':''} ${done.has(i)?'done':''} ${fav.has(i)?'fav':''}" data-q="${i}">${String(i+1).padStart(2,'0')}</button>`).join('');g.querySelectorAll('.qnum').forEach(b=>b.onclick=()=>{index=+b.dataset.q;$('navOverlay').classList.remove('show');renderQuestion()})}$('prevBtn').onclick=()=>change(-1);$('nextBtn').onclick=()=>change(1);$('checkBtn').onclick=checkAnswer;$('revealBtn').onclick=reveal;$('speakBtn').onclick=speak;$('hintBtn').onclick=()=>{if(questions[index].hint)$('hintline').classList.toggle('show')};$('favBtn').onclick=()=>{fav.has(index)?fav.delete(index):fav.add(index);renderQuestion()};$('progressBtn').onclick=()=>{$('navOverlay').classList.add('show');updateNav()};$('fontBtn').onclick=()=>$('fontOverlay').classList.add('show');$('fontRange').oninput=e=>document.documentElement.style.setProperty('--fs',e.target.value/100);$('soundBtn').onclick=()=>{soundEnabled=!soundEnabled;$('soundBtn').classList.toggle('muted',!soundEnabled);if(soundEnabled)typingSound()};$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));document.addEventListener('keydown',e=>{const editing=document.activeElement?.classList?.contains('slot')||document.activeElement?.contentEditable==='true';if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));if(editing)return;if(currentPage==='explain'&&e.key==='ArrowRight')change(1);if(currentPage==='explain'&&e.key==='ArrowLeft')change(-1)});renderQuestion();
</script>
